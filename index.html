function fmtPct(v, digits=1) {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  return Number(v).toFixed(digits) + "%";
}
function deltaHTML(v, digits=1) {
  if (v === null || v === undefined || Number.isNaN(v)) return '<span class="flat">—</span>';
  const cls = v > 0.05 ? "up" : (v < -0.05 ? "down" : "flat");
  const arrow = v > 0.05 ? "▲" : (v < -0.05 ? "▼" : "●");
  const sign = v > 0 ? "+" : "";
  return `<span class="${cls}">${arrow} ${sign}${Number(v).toFixed(digits)}</span>`;
}
function marginBadge(v, thr) {
  if (v === null || v === undefined) return '<span class="badge neu">n/a</span>';
  if (v < thr.margin_critical) return `<span class="badge bad">${fmtPct(v)}</span>`;
  if (v < thr.margin_warn) return `<span class="badge warn">${fmtPct(v)}</span>`;
  return `<span class="badge good">${fmtPct(v)}</span>`;
}
function objBadge(v, thr) {
  if (v === null || v === undefined) return '<span class="badge neu">n/a</span>';
  if (v < thr.obj_critical) return `<span class="badge bad">${fmtPct(v,0)}</span>`;
  if (v < thr.obj_warn) return `<span class="badge warn">${fmtPct(v,0)}</span>`;
  return `<span class="badge good">${fmtPct(v,0)}</span>`;
}

const charts = {};
function killCharts() {
  Object.keys(charts).forEach(k => { try { charts[k].destroy(); } catch(e) {} delete charts[k]; });
}
function chartDefaults() {
  Chart.defaults.color = "#8fa0b8";
  Chart.defaults.borderColor = "rgba(36,48,73,.8)";
  Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif";
}

function sparkCanvas(values, color) {
  const w = 88, h = 28;
  const nums = values.filter(v => v !== null && v !== undefined);
  if (nums.length < 2) return "";
  const min = Math.min(...nums), max = Math.max(...nums);
  const span = (max - min) || 1;
  const pts = values.map((v,i) => {
    if (v === null || v === undefined) return null;
    const x = (i / (values.length - 1)) * (w - 2) + 1;
    const y = h - 2 - ((v - min) / span) * (h - 4);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).filter(Boolean).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="${color}" stroke-width="2" points="${pts}"/></svg>`;
}

      <div class="chart-box">
        <h3>All stores — current CP GP Margin</h3>
        <div class="chart-wrap" style="height:420px"><canvas id="cAllMargin"></canvas></div>
      </div>
      <div class="chart-box">
        <h3>Day-over-day movers (pts)</h3>
        <div class="chart-wrap" style="height:420px"><canvas id="cMovers"></canvas></div>
      </div>
    </div>

    <div class="section">
      <h2>Alerts</h2>
      ${alertsHtml}
    </div>
  `;

  chartDefaults();
  charts.cTotalMargin = new Chart(document.getElementById("cTotalMargin"), {
    type: "line",
    data: {
      labels: d.dates_display,
      datasets: [{
        label: "TOTAL",
        data: t.margin_hist,
        borderColor: "#3db5ff",
        backgroundColor: "rgba(61,181,255,.12)",
        fill: true,
        tension: .25,
        pointRadius: 2,
      }, {
        label: `${thr.margin_critical}% target`,
        data: d.dates_display.map(() => thr.margin_critical),
        borderColor: "#ff5c6c",
        borderDash: [6,4],
        pointRadius: 0,
        borderWidth: 1.5,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: true } },
      scales: { y: { ticks: { callback: v => v + "%" } } }
    }
  });

  charts.cTotalObj = new Chart(document.getElementById("cTotalObj"), {
    type: "line",
    data: {
      labels: d.dates_display,
      datasets: [{
        label: "TOTAL obj",
        data: t.obj_hist,
        borderColor: "#2ecc71",
        backgroundColor: "rgba(46,204,113,.12)",
        fill: true,
        tension: .25,
        pointRadius: 2,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { ticks: { callback: v => v + "%" } } }
    }
  });

  const sorted = [...d.dealers].filter(x => x.margin != null).sort((a,b)=>a.margin-b.margin);
  charts.cAllMargin = new Chart(document.getElementById("cAllMargin"), {
    type: "bar",
    data: {
      labels: sorted.map(x => x.dealer),
      datasets: [{
        label: "CP GP %",
        data: sorted.map(x => x.margin),
        backgroundColor: sorted.map(x => x.margin < thr.margin_critical ? "#ff5c6c" : (x.margin < thr.margin_warn ? "#f0b429" : "#2ecc71")),
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { x: { ticks: { callback: v => v + "%" } } }
    }
  });

  const movers = [...d.dealers].filter(x => x.delta_margin != null)
    .sort((a,b)=> Math.abs(b.delta_margin) - Math.abs(a.delta_margin)).slice(0, 16)
    .sort((a,b)=> a.delta_margin - b.delta_margin);
  charts.cMovers = new Chart(document.getElementById("cMovers"), {
    type: "bar",
    data: {
      labels: movers.map(x => x.dealer),
      datasets: [{
        label: "Δ margin pts",
        data: movers.map(x => x.delta_margin),
        backgroundColor: movers.map(x => x.delta_margin >= 0 ? "#2ecc71" : "#ff5c6c"),
      }]
    },
    options: {
      indexAxis: "y",
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
    }
  });
}

function renderWatchlist() {
  const thr = DATA.thresholds;
  const rows = DATA.below_41;
  document.getElementById("app").innerHTML = `
    <div class="section">
      <h2>Customer Pay margin below ${thr.margin_critical}% · ${rows.length} stores</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Dealership</th><th>Region</th><th>Brand</th>
              <th>Margin</th><th>vs prior</th><th>Obj</th><th>Trend</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td><strong>${r.dealer}</strong></td>
                <td class="muted">${r.region || ""}</td>
                <td class="muted">${r.brand || ""}</td>
                <td>${marginBadge(r.margin, thr)}</td>
                <td>${deltaHTML(r.delta_margin)}</td>
                <td>${objBadge(r.obj, thr)}</td>
                <td>${sparkCanvas(r.margin_hist, "#ff5c6c")}</td>
              </tr>`).join("") || `<tr><td colspan="7" class="muted">None under ${thr.margin_critical}% — nice day.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
    <div class="chart-box">
      <h3>Watchlist margin history</h3>
      <div class="chart-wrap" style="height:360px"><canvas id="cWatch"></canvas></div>
    </div>
  `;
  chartDefaults();
  const colors = ["#ff5c6c","#f0b429","#3db5ff","#a78bfa","#2ecc71","#fb7185","#38bdf8","#fbbf24","#c084fc","#34d399"];
  charts.cWatch = new Chart(document.getElementById("cWatch"), {
    type: "line",
    data: {
      labels: DATA.dates_display,
      datasets: rows.slice(0,10).map((r,i) => ({
        label: r.dealer,
        data: r.margin_hist,
        borderColor: colors[i % colors.length],
        tension: .25,
        pointRadius: 1.5,
        borderWidth: 2,
      })).concat([{
        label: "41% line",
        data: DATA.dates_display.map(() => thr.margin_critical),
        borderColor: "rgba(255,92,108,.7)",
        borderDash: [5,4],
        pointRadius: 0,
        borderWidth: 1.5,
      }])
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: { y: { ticks: { callback: v => v + "%" } } }
    }
  });
}

function renderBrands() {
  const thr = DATA.thresholds;
  const order = DATA.brand_order.filter(b => DATA.brands[b]);
  document.getElementById("app").innerHTML = `
    <div class="brand-grid" id="brand-grid">
      ${order.map(b => {
        const info = DATA.brands[b];
        const avg = info.avg_margin;
        return `<div class="brand-card" data-brand="${b}">
          <h3>${b}</h3>
          <div class="avg">${fmtPct(avg)}</div>
          <div class="meta muted" style="margin-top:6px">${info.members.length} stores · ${info.count_below} under ${thr.margin_critical}%</div>
        </div>`;
      }).join("")}
    </div>
    <div id="brand-detail"></div>
  `;

  function showBrand(name) {
    const info = DATA.brands[name];
    if (!info) return;
    const members = [...info.members].sort((a,b)=>(b.margin??-1)-(a.margin??-1));
    document.getElementById("brand-detail").innerHTML = `
      <div class="section" style="margin-top:12px">
        <h2>${name} comparison</h2>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th>Store</th><th>Margin</th><th>vs prior</th><th>Obj</th><th>vs prior obj</th><th>Spark</th>
            </tr></thead>
            <tbody>
              ${members.map(r => `<tr>
                <td><strong>${r.dealer}</strong> <span class="muted">${r.region||""}</span></td>
                <td>${marginBadge(r.margin, thr)}</td>
                <td>${deltaHTML(r.delta_margin)}</td>
                <td>${objBadge(r.obj, thr)}</td>
                <td>${deltaHTML(r.delta_obj,1)}</td>
                <td>${sparkCanvas(r.margin_hist, "#3db5ff")}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
      <div class="charts two">
        <div class="chart-box">
          <h3>${name} — CP GP Margin</h3>
          <div class="chart-wrap"><canvas id="cBrandBar"></canvas></div>
        </div>
        <div class="chart-box">
          <h3>${name} — margin trends</h3>
          <div class="chart-wrap"><canvas id="cBrandLines"></canvas></div>
        </div>
      </div>
    `;
    killCharts(); // keep only brand charts — careful: kills all
    // re-bind? we only want brand charts here
    chartDefaults();
    const colors = ["#3db5ff","#2ecc71","#f0b429","#a78bfa","#ff5c6c","#38bdf8","#fb7185","#34d399"];
    charts.cBrandBar = new Chart(document.getElementById("cBrandBar"), {
      type: "bar",
      data: {
        labels: members.map(m => m.dealer),
        datasets: [{
          data: members.map(m => m.margin),
          backgroundColor: members.map(m => m.margin != null && m.margin < thr.margin_critical ? "#ff5c6c" : (m.margin != null && m.margin < thr.margin_warn ? "#f0b429" : "#2ecc71")),
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { callback: v => v + "%" } } }
      }
    });
    charts.cBrandLines = new Chart(document.getElementById("cBrandLines"), {
      type: "line",
      data: {
        labels: DATA.dates_display,
        datasets: members.map((m,i) => ({
          label: m.dealer,
          data: m.margin_hist,
          borderColor: colors[i % colors.length],
          tension: .25,
          pointRadius: 1.5,
          borderWidth: 2,
        })).concat([{
          label: "41%",
          data: DATA.dates_display.map(() => thr.margin_critical),
          borderColor: "rgba(255,92,108,.65)",
          borderDash: [5,4],
          pointRadius: 0,
        }])
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { ticks: { callback: v => v + "%" } } }
      }
    });
  }

  document.querySelectorAll(".brand-card").forEach(el => {
    el.addEventListener("click", () => showBrand(el.dataset.brand));
  });
  if (order.length) showBrand(order[0]);
}

function renderMovers() {
  const thr = DATA.thresholds;
  const gainers = DATA.gainers;
  const losers = DATA.losers;
  document.getElementById("app").innerHTML = `
    <div class="charts two">
      <div class="section">
        <h2>Top gainers (day-over-day)</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Store</th><th>Margin</th><th>Δ</th><th>Trend</th></tr></thead>
            <tbody>
              ${gainers.map(r => `<tr>
                <td><strong>${r.dealer}</strong></td>
                <td>${marginBadge(r.margin, thr)}</td>
                <td>${deltaHTML(r.delta_margin)}</td>
                <td>${sparkCanvas(r.margin_hist, "#2ecc71")}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
      <div class="section">
        <h2>Top decliners (day-over-day)</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Store</th><th>Margin</th><th>Δ</th><th>Trend</th></tr></thead>
            <tbody>
              ${losers.map(r => `<tr>
                <td><strong>${r.dealer}</strong></td>
                <td>${marginBadge(r.margin, thr)}</td>
                <td>${deltaHTML(r.delta_margin)}</td>
                <td>${sparkCanvas(r.margin_hist, "#ff5c6c")}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;
}

function renderScoreboard() {
  const thr = DATA.thresholds;
  document.getElementById("app").innerHTML = `
    <div class="section">
      <div class="filters">
        <input id="q" placeholder="Filter stores…" />
        <select id="sort">
          <option value="margin-asc">Margin ↑</option>
          <option value="margin-desc">Margin ↓</option>
          <option value="delta-asc">Biggest drop</option>
          <option value="delta-desc">Biggest gain</option>
          <option value="obj-asc">Obj ↑</option>
          <option value="name">Name</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th><th>Dealership</th><th>Brand</th><th>Margin</th>
              <th>Δ day</th><th>Obj</th><th>Δ obj</th><th>Trend</th>
            </tr>
          </thead>
          <tbody id="score-body"></tbody>
        </table>
      </div>
    </div>
  `;
  function paint() {
    const q = (document.getElementById("q").value || "").toLowerCase();
    const sort = document.getElementById("sort").value;
    let rows = DATA.dealers.filter(r =>
      !q || r.dealer.toLowerCase().includes(q) || (r.brand||"").toLowerCase().includes(q)
    );
    const sorters = {
      "margin-asc": (a,b)=>(a.margin??999)-(b.margin??999),
      "margin-desc": (a,b)=>(b.margin??-999)-(a.margin??-999),
      "delta-asc": (a,b)=>(a.delta_margin??0)-(b.delta_margin??0),
      "delta-desc": (a,b)=>(b.delta_margin??0)-(a.delta_margin??0),
      "obj-asc": (a,b)=>(a.obj??999)-(b.obj??999),
      "name": (a,b)=>a.dealer.localeCompare(b.dealer),
    };
    rows = [...rows].sort(sorters[sort] || sorters["margin-asc"]);
    document.getElementById("score-body").innerHTML = rows.map((r,i) => `
      <tr>
        <td class="muted">${i+1}</td>
        <td><strong>${r.dealer}</strong> <span class="muted">${r.region||""}</span></td>
        <td class="muted">${r.brand||""}</td>
        <td>${marginBadge(r.margin, thr)}</td>
        <td>${deltaHTML(r.delta_margin)}</td>
        <td>${objBadge(r.obj, thr)}</td>
        <td>${deltaHTML(r.delta_obj,1)}</td>
        <td>${sparkCanvas(r.margin_hist, "#3db5ff")}</td>
      </tr>
    `).join("");
  }
  document.getElementById("q").addEventListener("input", paint);
  document.getElementById("sort").addEventListener("change", paint);
  paint();
}

const renderers = {
  overview: renderOverview,
  watchlist: renderWatchlist,
  brands: renderBrands,
  movers: renderMovers,
  scoreboard: renderScoreboard,
};

function setTab(name) {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === name));
  killCharts();
  (renderers[name] || renderOverview)();
}

function boot() {
  if (!DATA || DATA.empty) {
    renderEmpty();
    return;
  }
  document.getElementById("hdr-sub").textContent =
    `As of ${DATA.latest_display} · ${DATA.dealers.length} stores · history ${DATA.dates_display[0]} → ${DATA.latest_display} · built ${DATA.generated_at}`;
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setTab(t.dataset.tab)));
  setTab("overview");
}
boot();
</script>
</body>
</html>
